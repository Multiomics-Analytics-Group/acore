[project]
authors = [
  { name = "Alberto Santos Delgado", email = "albsad@dtu.dk" },
  { name = "Henry Webel", email = "heweb@dtu.dk" },
]
name = "acore"
dynamic = ["version"]
description = "A Python package with statistical functions to analyse multimodal molecular data"
license = { text = "GNU General Public License v3" }
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "numpy",
  # pandas stuff
  "pandas",
  "dsp-pandas", # https://github.com/biosustain/dsp_pandas  (import dsp_pandas)
  # scientific computing
  "scipy",
  "scikit-learn>=1.5",
  # enrichment analysis dependencies
  "gseapy!=1.1.5",
  "pingouin<0.6.0", # ToDo: update column name changes, https://pingouin-stats.org/changelog.html#v0-6-0-february-2026
  "umap-learn",
  "statsmodels",
  # batch correction dependencies
  "combat",
  "inmoose", # combat batch correction
  # io dependencies
  "requests",
  "rarfile",
  # types
  "pandera",
]

[project.optional-dependencies]
docs = [
  "sphinx",
  "sphinx-book-theme",
  "myst-nb",
  "ipywidgets",
  "sphinx-new-tab-link!=0.2.2",
  "jupytext",
  "sphinx-copybutton",
  "sphinx-llms-txt",
  # Multi-Omics-Analysis group package for visualisation of results in the documentation
  "vuecore",
]
dev = [
  "black[jupyter]",
  "flake8",
  "ruff",
  "isort",
  "pytest",
  "pytest-cov",
  "twine",
  "wheel",
  "jupytext",
  "ipykernel",
]

all = [ # Optional dependencies for all non-core analysis modules
  # Publication analysis dependencies
  "biopython",
  # Topological Data Analysis
  # network analysis dependencies
  "python-louvain", # community detection for network analysis (import community)
  "networkx",
  # "PyWGCNA!=2.2.0", # not used?
  # Kaplan-Meier-analysis dependencies
  "lifelines",
  "kmapper",
  # network_analysis dependencies
  "snfpy",
]

[project.urls]
Homepage = "https://github.com/Multiomics-Analytics-Group/acore"
Issues = "https://github.com/Multiomics-Analytics-Group/acore/issues"
Documentation = "https://analytics-core.readthedocs.io/"

[tool.ruff]
# https://docs.astral.sh/ruff/rules/#flake8-bandit-s

[tool.ruff.lint]
# https://docs.astral.sh/ruff/tutorial/#rule-selection
# 1. Enable flake8-bugbear (`B`) rules
# 2. Enable pycodestyle (`E`) errors and (`W`) warnings
# 3. Pyflakes (`F`) errors
# extend-select = ["E", "W", "F", "B"]
# Ignore line length errors:
# ignore = ["E501"]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# https://setuptools-scm.readthedocs.io/ 
# used to pick up the version from the git tags or the latest commit.

[tool.isort]
profile = "black"

